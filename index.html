<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KAN Autoparts - Orders</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');

    :root {
      --navy-primary: #082B55;
      --navy-charcoal: #183041;
      --gold-champagne: #C99632;
      --gold-accent: #D4A447;
      --cream-canvas: #F6F4ED;
      --cream-surface: #FFFDFA;
      --teal-primary: #1C6668;
      --teal-action: #0C4144;
      --text-main: #183041;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; font-family: 'Sarabun', sans-serif; background-color: var(--cream-canvas); color: var(--text-main); }

    .app-viewport { display: flex; flex-direction: column; min-height: 100vh; max-width: 500px; margin: 0 auto; background-color: var(--cream-canvas); position: relative; }

    .filter-section { position: sticky; top: 0; z-index: 100; background: var(--cream-surface); padding: 12px 14px 10px; border-bottom: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 0.88rem; outline: none; background: var(--cream-canvas); color: var(--text-main); }
    .search-input:focus { border-color: var(--teal-primary); background: #ffffff; }

    .cache-status { font-size: 0.75rem; background: rgba(8, 43, 85, 0.06); padding: 6px 10px; border-radius: 8px; font-weight: 600; color: var(--navy-primary); border: 1px solid rgba(8, 43, 85, 0.1); white-space: nowrap; }

    .cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; -webkit-overflow-scrolling: touch; }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--cream-canvas); color: var(--text-muted); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .cat-btn.active { background: var(--navy-primary); color: #ffffff; border-color: var(--navy-primary); }

    .product-feed { flex: 1; padding: 12px; padding-bottom: 160px; }
    .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .product-card { background: var(--cream-surface); border: 1px solid rgba(8, 43, 85, 0.1); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 6px rgba(24, 48, 65, 0.04); }
    .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: var(--cream-canvas); }
    .product-sku { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-top: 6px; }
    .product-title { font-weight: 600; font-size: 0.88rem; color: var(--text-main); margin: 2px 0 6px; line-height: 1.3; height: 2.6em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    
    .price-container { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .price-main-row { display: flex; align-items: baseline; gap: 4px; }
    .price-main { font-size: 0.95rem; color: var(--navy-primary); font-weight: 700; }

    .price-bulk-tag {
      font-size: 0.72rem;
      color: #925800;
      font-weight: 700;
      background: rgba(201, 150, 50, 0.15);
      border: 1px solid rgba(201, 150, 50, 0.4);
      padding: 5px 7px;
      border-radius: 6px;
      width: 100%;
      line-height: 1.2;
    }

    .btn-add { background: var(--teal-action); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; width: 100%; cursor: pointer; transition: background 0.2s; }
    .btn-add.added { background: #16a34a; }

    .floating-cart-wrapper { position: fixed; left: 0; right: 0; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); z-index: 990; display: flex; justify-content: center; padding: 0 14px; pointer-events: none; }
    .floating-cart-card { width: 100%; max-width: 470px; pointer-events: auto; background: var(--navy-charcoal); color: #ffffff; border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(201, 150, 50, 0.4) inset; }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge { background: var(--gold-champagne); width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; position: relative; }
    .cart-count-bubble { position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; border: 2px solid var(--navy-charcoal); }
    .cart-total-price { font-size: 1.1rem; font-weight: 700; color: var(--gold-accent); }
    .cart-subtext { font-size: 0.75rem; color: #94a3b8; }
    .btn-checkout-floating { background: var(--teal-primary); color: #ffffff; border: 1px solid rgba(255,255,255,0.15); padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer; }

    .bottom-sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8, 43, 85, 0.65); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: flex-end; }
    .bottom-sheet-overlay.open { display: flex; }
    .bottom-sheet-content { background: var(--cream-surface); width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0; padding: 20px 16px; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }

    .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border-color); font-size: 0.85rem; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 28px; height: 28px; background: var(--cream-canvas); border: 1px solid var(--border-color); border-radius: 6px; font-weight: bold; color: var(--text-main); }

    .form-input { width: 100%; padding: 10px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 0.88rem; margin-top: 4px; outline: none; background: #ffffff; color: var(--text-main); }
    .form-group { margin-top: 10px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .btn-submit-order { width: 100%; background: #16a34a; color: white; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; margin-top: 16px; cursor: pointer; }

    .toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #10b981; color: white; padding: 8px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: all 0.2s ease; pointer-events: none; z-index: 2000; }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .btn-retry { background: var(--navy-primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <div id="toast" class="toast-box">เพิ่มลงตะกร้าแล้ว</div>

    <div class="filter-section">
      <div class="search-row">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 ค้นชื่อ หรือ รหัส SKU อะไหล่..." oninput="filterProducts()">
        <span class="cache-status" id="cache-indicator">🔄 เชื่อมต่อ...</span>
      </div>
      <div class="cat-scroll" id="cat-scroll">
        <button class="cat-btn active" onclick="setCategory('ALL', this)">ทั้งหมด</button>
      </div>
    </div>

    <div class="product-feed">
      <div class="product-grid" id="product-grid">
        <div style="grid-column: 1/-1; text-align:center; padding: 50px 20px; color:var(--text-muted);">
          <div>⏳ กำลังโหลดข้อมูลสินค้า...</div>
        </div>
      </div>
    </div>

    <div class="floating-cart-wrapper">
      <div class="floating-cart-card">
        <div class="cart-info">
          <div class="cart-badge">
            🛒<span class="cart-count-bubble" id="bar-count">0</span>
          </div>
          <div>
            <div class="cart-total-price" id="bar-total">฿0</div>
            <div class="cart-subtext" id="bar-item-text">ยังไม่มีสินค้า</div>
          </div>
        </div>
        <button class="btn-checkout-floating" onclick="toggleBottomSheet(true)">ดูตะกร้า ›</button>
      </div>
    </div>

    <div class="bottom-sheet-overlay" id="bottom-sheet">
      <div class="bottom-sheet-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="font-size:1.05rem; font-weight:700; color:var(--navy-primary);">🛒 ตะกร้าสินค้า KAN</h3>
          <button style="border:none; background:var(--cream-canvas); padding:6px 14px; border-radius:14px; font-weight:600; color:var(--text-muted);" onclick="toggleBottomSheet(false)">✕ ปิด</button>
        </div>

        <div id="cart-list" style="max-height: 200px; overflow-y: auto;">
          <div style="text-align:center; color:var(--text-muted); padding: 20px; font-size:0.85rem;">ไม่มีสินค้าในตะกร้า</div>
        </div>

        <div style="display:flex; justify-content:space-between; font-weight:700; padding: 10px 0; border-top:1px solid var(--border-color); margin-top:10px; font-size:0.95rem;">
          <span>ยอดรวมสุทธิ:</span>
          <span id="sheet-total" style="color:var(--navy-primary);">฿0</span>
        </div>

        <form onsubmit="handleCheckout(event)">
          <div class="form-group">
            <label>ชื่อ-นามสกุลผู้รับ *</label>
            <input type="text" id="c-name" class="form-input" required placeholder="กรอกชื่อ-นามสกุล">
          </div>
          <div class="form-group">
            <label>เบอร์โทรศัพท์ *</label>
            <input type="tel" id="c-phone" class="form-input" required placeholder="08XXXXXXXX">
          </div>
          <div class="form-group">
            <label>ที่อยู่จัดส่งสินค้า *</label>
            <textarea id="c-address" class="form-input" rows="2" required placeholder="บ้านเลขที่, ถนน, ตำบล/อำเภอ, จังหวัด"></textarea>
          </div>
          <button type="submit" class="btn-submit-order">🚀 ยืนยันสั่งซื้อสินค้า</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1vlgiJDohphdDa-2q8WIGzI41NesIFoYwgyzMWT_Rq-xVioYfx50WzmbvTys5uKuc/exec";
    const LINE_OA_ID = "617ytnjm";
    const CACHE_KEY = "KAN_PRODUCTS_CACHE_V3";

    let productsMaster = [];
    let currentCategory = 'ALL';
    let cart = [];

    window.onload = () => {
      initProducts();
    };

    function initProducts() {
      const statusEl = document.getElementById('cache-indicator');
      const cached = localStorage.getItem(CACHE_KEY);

      if (cached) {
        try {
          productsMaster = JSON.parse(cached);
          if (Array.isArray(productsMaster) && productsMaster.length > 0) {
            renderCategories();
            renderGrid(productsMaster);
            statusEl.innerText = '⚡ แคชชั่วคราว';
          }
        } catch(e) {}
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      fetch(SCRIPT_URL, { signal: controller.signal })
        .then(res => res.json())
        .then(data => {
          clearTimeout(timeoutId);
          const items = data.products || (Array.isArray(data) ? data : null);
          
          if (items && items.length > 0) {
            productsMaster = items;
            localStorage.setItem(CACHE_KEY, JSON.stringify(productsMaster));
            renderCategories();
            renderGrid(productsMaster);
            statusEl.innerText = '✓ อัปเดตสด';
            console.log("📥 โหลดข้อมูลสำเร็จ ตัวอย่างสินค้าชิ้นที่ 1:", productsMaster[0]);
          }
        })
        .catch(err => {
          clearTimeout(timeoutId);
          if (!productsMaster.length) {
            showError('การเชื่อมต่อตอบสนองช้า');
          }
        });
    }

    function showError(msg) {
      document.getElementById('product-grid').innerHTML = `
        <div style="grid-column: 1/-1; text-align:center; padding: 40px 20px; color:var(--text-muted);">
          <div style="font-size: 1.8rem; margin-bottom: 8px;">⚠️</div>
          <div style="font-size: 0.9rem; font-weight: 600; color: #ef4444;">${msg}</div>
          <button class="btn-retry" onclick="initProducts()">🔄 โหลดใหม่อีกครั้ง</button>
        </div>
      `;
    }

    function renderCategories() {
      const cats = ['ALL', ...new Set(productsMaster.map(p => p.category).filter(Boolean))];
      document.getElementById('cat-scroll').innerHTML = cats.map(c => `
        <button class="cat-btn ${c === 'ALL' ? 'active' : ''}" onclick="setCategory('${c}', this)">${c === 'ALL' ? 'ทั้งหมด' : c}</button>
      `).join('');
    }

    // ฟังก์ชันดึงค่า Price 2 รองรับทุกรูปแบบอย่างครอบคลุมที่สุด
    function getPrice2(p) {
      const val = p['Price 2'] ?? p['price 2'] ?? p['PRICE 2'] ?? p.Price2 ?? p.price2 ?? p.price_2 ?? p.Price_2;
      return Number(val) || 0;
    }

    function renderGrid(list) {
      const grid = document.getElementById('product-grid');
      if (!list || list.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:30px;">ไม่พบรายการสินค้า</div>';
        return;
      }

      grid.innerHTML = list.map(p => {
        const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/150';
        
        const priceNormal = Number(p.price || p.Price || p.PRICE || 0);
        const priceBulkUnit = getPrice2(p);
        const hasBulkPrice = priceBulkUnit > 0;

        return `
          <div class="product-card">
            <div>
              <img src="${img}" class="product-img" loading="lazy">
              <div class="product-sku">${p.sku || '-'}</div>
              <div class="product-title">${p.name || 'ไม่ระบุชื่อ'}</div>
              
              <div class="price-container">
                <div class="price-main-row">
                  <span class="price-main">฿${priceNormal.toLocaleString()} /ตัว</span>
                </div>
                
                ${hasBulkPrice ? `
                  <div class="price-bulk-tag">
                    🔥 5 ตัวขึ้นไป เหลือเพียง ฿${priceBulkUnit.toLocaleString()} /ตัว
                  </div>
                ` : ''}
              </div>
            </div>
            <button class="btn-add" id="btn-${p.sku}" onclick="addToCart('${p.sku}')">+ ใส่ตะกร้า</button>
          </div>
        `;
      }).join('');
    }

    function addToCart(sku) {
      const p = productsMaster.find(i => i.sku === sku);
      const exist = cart.find(i => i.sku === sku);
      if (exist) { exist.qty += 1; }
      else { cart.push({ ...p, qty: 1 }); }

      const btn = document.getElementById(`btn-${sku}`);
      if (btn) {
        btn.classList.add('added');
        btn.innerText = '✓ เพิ่มแล้ว';
        setTimeout(() => {
          btn.classList.remove('added');
          btn.innerText = '+ ใส่ตะกร้า';
        }, 1000);
      }

      showToast();
      updateCartUI();
    }

    function updateCartUI() {
      let total = 0, count = 0;
      const container = document.getElementById('cart-list');

      if (cart.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding: 20px; font-size:0.85rem;">ไม่มีสินค้าในตะกร้า</div>';
        document.getElementById('bar-item-text').innerText = 'ยังไม่มีสินค้า';
      } else {
        container.innerHTML = cart.map(i => {
          const priceNormal = Number(i.price || i.Price || i.PRICE || 0);
          const priceBulkUnit = getPrice2(i);

          const activeUnitPrice = (i.qty >= 5 && priceBulkUnit > 0) ? priceBulkUnit : priceNormal;
          const sum = activeUnitPrice * i.qty;
          
          total += sum;
          count += i.qty;
          
          return `
            <div class="cart-item-row">
              <div style="flex:1;">
                <div style="font-weight:600; color:var(--text-main);">${i.name}</div>
                <div style="color:var(--text-muted); font-size:0.78rem;">
                  ฿${activeUnitPrice.toLocaleString()} /ตัว 
                  ${i.qty >= 5 && priceBulkUnit > 0 ? '<span style="color:#16a34a; font-weight:600;">(ราคาส่ง 5+ ตัว)</span>' : ''}
                </div>
              </div>
              <div class="qty-control">
                <button type="button" class="qty-btn" onclick="changeQty('${i.sku}', -1)">-</button>
                <span style="font-weight:600;">${i.qty}</span>
                <button type="button" class="qty-btn" onclick="changeQty('${i.sku}', 1)">+</button>
                <span style="width:55px; text-align:right; font-weight:700; color:var(--navy-primary);">฿${sum.toLocaleString()}</span>
              </div>
            </div>
          `;
        }).join('');
        document.getElementById('bar-item-text').innerText = `พร้อมชำระเงิน (${count} ชิ้น)`;
      }

      document.getElementById('bar-count').innerText = count;
      document.getElementById('bar-total').innerText = `฿${total.toLocaleString()}`;
      document.getElementById('sheet-total').innerText = `฿${total.toLocaleString()}`;
    }

    function changeQty(sku, delta) {
      const item = cart.find(i => i.sku === sku);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.sku !== sku);
      }
      updateCartUI();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function toggleBottomSheet(open) {
      const sheet = document.getElementById('bottom-sheet');
      if (open) sheet.classList.add('open');
      else sheet.classList.remove('open');
    }

    function filterProducts() {
      const text = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = productsMaster.filter(p => {
        const matchCat = (currentCategory === 'ALL' || p.category === currentCategory);
        const matchSearch = (p.name && p.name.toLowerCase().includes(text)) || (p.sku && p.sku.toLowerCase().includes(text));
        return matchCat && matchSearch;
      });
      renderGrid(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterProducts();
    }

    function handleCheckout(e) {
      e.preventDefault();
      if (cart.length === 0) return alert('กรุณาเลือกสินค้าก่อนครับ');

      const name = document.getElementById('c-name').value;
      const phone = document.getElementById('c-phone').value;
      const address = document.getElementById('c-address').value;

      const total = cart.reduce((s, i) => {
        const priceNormal = Number(i.price || i.Price || i.PRICE || 0);
        const priceBulkUnit = getPrice2(i);
        const activeUnitPrice = (i.qty >= 5 && priceBulkUnit > 0) ? priceBulkUnit : priceNormal;
        return s + (activeUnitPrice * i.qty);
      }, 0);

      const orderId = `ORD-${Date.now().toString().slice(-6)}`;

      const formData = new URLSearchParams();
      formData.append('name', name);
      formData.append('phone', phone);
      formData.append('address', address);
      formData.append('items', cart.map(i => `${i.sku} (${i.qty} ชิ้น)`).join(', '));
      formData.append('total', total);
      fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData });

      const msg = encodeURIComponent(`แจ้งชำระเงินออเดอร์ KAN: ${orderId}\nคุณ: ${name}\nยอดรวม: ฿${total.toLocaleString()}`);
      window.location.href = `https://line.me/R/ti/p/@${LINE_OA_ID}?text=${msg}`;
    }
  </script>
</body>
</html>
